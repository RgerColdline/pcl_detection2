initial_enable: true

# 数据源选择：
#   fastlio = 订阅 /fastlio_map(FAST-LIO2 累积地图) + /Odometry，camera_init 系与 odom 重合，
#             不再自建图/ICP（仿真链路，柱子/方环/障碍物管线统一吃 fastlio 地图）
#   livox   = 订阅 /livox/lidar + mavros 里程计自建图配准（旧链路，保留备用）
cloud_source: fastlio

debug:
  timing_enable: true

livox_roi:
  uav_radius: 0.3
  max_coord: 20.0
  debug_level: 0

voxel:
  leaf_size: 0.03                         # 减小体素，保留更多点云细节

map:
  decay_coeff: 0.02
  ini_intensity: 50
  registration_frame_num: 5
  local_frame_num: 15
  rebuild_every_n_frames: 5

register:
  max_correspondence_distance: 0.15
  max_iter: 1000
  transformation_epsilon: 1e-6
  euclidean_fitness_epsilon: 1e-5
  max_fitness_score: 0.5
  max_translation_delta: 0.5
  max_rotation_delta_deg: 15.0
  submap_x_radius: 3.0
  submap_y_radius: 3.0
  submap_z_radius: 1.5
  min_submap_points: 100

roi:
  uav_radius: 0.3
  x_min: -3.25
  x_max: 0.55
  y_min: -3.15
  y_max: 0.65
  z_min: 0.3
  z_max: 1.5

# ── 配准前ROI：在ICP配准之前先用ROI裁剪世界坐标点云，减少无关背景点干扰 ──
# 未指定时默认沿用上方 roi: 的对应值
pre_register_roi:
  enabled: true         # 配准计算变换矩阵之前是否先roi
  min_points: 20         # ROI后最少点数，低于此回退全量点云
  # x_min: -3.25         # 不设则用 roi/x_min
  # x_max: 0.55
  # y_min: -3.15
  # y_max: 0.65
  # z_min: 0.3
  # z_max: 1.5

dilation:
  radius: 0
  steps: 12

erosion:
  mean_k: 7
  thresh: 0.8

projection:
  plane_z: 0.7

# ==================== 方环检测 (穿环) ====================
ring_pipeline:
  enabled: true
  input_cloud_topic: "/pcl_detection2/downsampled_accumulated_cloud"
  publish_debug_cloud: true
  max_planes: 2
  dump_enabled: false          # 调试用：启动15s后每5s保存投影图到temp/

ring_plane:
  # ROI (平面提取前的裁剪范围，世界坐标系)
  roi_x_min: -2.0
  roi_x_max: -0.5
  roi_y_min: -1.00
  roi_y_max: 1.25
  roi_z_min: -0.15
  roi_z_max: 3.25

  # 欧式聚类
  cluster_tolerance: 0.15
  cluster_min_size: 100
  cluster_max_size: 30000

  # RANSAC 平面拟合
  ransac_distance_threshold: 0.03
  ransac_min_inliers: 50
  max_planes_per_cluster: 4      # 每个欧式聚类中最多提取的平面数 (迭代RANSAC)

  # 平面筛选
  min_plane_area_points: 300
  max_plane_vertical_angle: 30.0

  # 投影参数
  projection_resolution: 0.05
  projection_margin: 20

ring_match:
  # 模板图片路径列表 (YAML数组，顺序=优先级，高优先级先匹配)
  # 相对路径会相对于 <pcl_detection2 包路径>/templates/ 解析
  template_paths:
    - "obs1.png"
    - "obs_from_dump.png"

  # 单模板路径 (当 template_paths 为空时使用)
  template_path: ""

  # 每个模板的独立阈值 (可选，数量和 template_paths 一致)
  # 不设置则统一使用 match_threshold
  template_thresholds: []

  match_threshold: 0.35                  # 降低，允许不完美的环被检出
  match_method: 5                        # TM_CCOEFF_NORMED

  # 多尺度匹配参数 (±30%, 更宽松的尺度容差)
  scale_x_min: 0.7
  scale_x_max: 1.3
  scale_x_step: 0.05
  scale_y_min: 0.7
  scale_y_max: 1.3
  scale_y_step: 0.05

  # NMS
  nms_iou_threshold: 0.3

  # 形态学核大小 (填充稀疏LiDAR投影的缝隙)
  # 点云噪点/偏移导致环边界有空洞，需用较大核做 CLOSE 填满
  # 0.05m/pixel × 9 = 0.45m，能填大多数空隙又不至于堵死孔洞
  morphology_kernel_size: 9

  # 每张投影图最大检测环数
  max_rings_per_image: 3

  # 环孔洞验证：排除实墙误匹配
  # 加大核后环可能被轻微填充，降低阈值避免误杀
  min_hole_ratio: 0.2

  # 轮廓检测 fallback
  expected_size_min: 100
  expected_size_max: 400
  contour_area_ratio_min: 0.5

# 环3D位置过滤（世界坐标系，发布前过滤掉位置不合理的环）
ring_filter:
  enabled: true
  x_min: -2.0
  x_max: -0.3
  y_min: -0.4
  y_max: 0.4
  z_min: 0.5
  z_max: 2.0

# === 柱子检测（坐标判定为主，模板匹配兜底，2026-08 重构）===
# 【case 命名规则（全队统一，与 raicom_vision_laser/config/traverse_map.yaml、
#   main_control 的 TRAV_CASE_PILLARS 一致，勿单独改）】
#   候选索引: 0=A左(2.7,1.55) 1=A右(3.3,1.55) 2=B左(2.7,2.8) 3=B右(3.3,2.8)（括号为场系坐标）
#   case0 = A左+B左（两柱都在 x=2.7）
#   case1 = A左+B右
#   case2 = A右+B左
#   case3 = A右+B右（两柱都在 x=3.3）
# 检测输出 /pcl_detection2/pillar_case_id 即此编号，直接当穿越 case 用。
pillar_detect_enabled: true

# ---- 坐标判定（主）：数 4 个候选柱位半径内 ROI 点数，A/B 侧各出 1 根拼 case ----
pillar_coord:
  radius: 0.25          # 柱位判定半径 (m)
  min_points: 5         # 半径内点数 >= 此值判"有柱"（仿真点云干净先取灵敏值，真机再调）
  confirm_frames: 3     # 连续 N 帧组合一致才发布（防单帧噪声误判）
  ambiguous_ratio: 0.8  # 同侧两候选都过阈值且点数比 >= 此值 -> 歧义，回退模板匹配

# ---- 模板匹配（兜底）：仅坐标判定歧义时使用 ----
# 注意：改动下方 pillar_roi/resolution 后必须重跑 tools/make_pillar_templates.py！
pillar_roi:
  x_min: -3.5
  x_max: -1.2
  y_min: -3.15
  y_max: 0.5
  z_min: 0.3
  z_max: 1.5
  resolution: 0.05
  match_threshold: 0.5    # 兜底判定阈值（合成分 = 模板分×(1+权重×密度分)）
  proj_upscale: 1         # 投影图放大倍数 (大于tpl以给matchTemplate留滑动空间)
  tpl_upscale: 1          # 模板放大倍数
  density_weight: 0.3     # 兜底合成分中密度分权重 (0~1)

# 4 个候选柱位（odom 系，= 场系绕出生点(0.65,0.75)转180°；坐标判定与模板共用）
pillar_pos:
  p1_pos1: [-2.05, -0.80]   # A左 = 场系 (2.7,1.55)
  p1_pos2: [-2.65, -0.80]   # A右 = 场系 (3.3,1.55)
  p2_pos1: [-2.05, -2.05]   # B左 = 场系 (2.7,2.8)
  p2_pos2: [-2.65, -2.05]   # B右 = 场系 (3.3,2.8)
