initial_enable: true

# 数据源选择：
#   fastlio = 订阅 /fastlio_map(FAST-LIO2 累积地图) + /Odometry，camera_init 系与 odom 重合，
#             不再自建图/ICP（仿真链路，柱子/方环/障碍物管线统一吃 fastlio 地图）
#   livox   = 订阅 /livox/lidar + mavros 里程计自建图配准（旧链路，保留备用）
cloud_source: fastlio

debug:
  timing_enable: false                # 关闭逐阶段计时打点（省每帧 WallTime + 每秒日志开销）

# Foxglove 3D 可视化。FAST-LIO /fastlio_map 原生在 camera_init 系，
# Marker 与点云使用同一坐标系，避免误标为 map/world 后依赖额外 TF。
visualization:
  frame_id: "camera_init"
  ring_width: 1.1
  ring_height: 1.1
  pillar_radius: 0.10
  pillar_height: 1.50
  pillar_base_z: 0.0

livox_roi:
  uav_radius: 0.3
  max_coord: 20.0
  debug_level: 0

voxel:
  leaf_size: 0.03                         # 减小体素，保留更多点云细节

map:
  decay_coeff: 0.02
  ini_intensity: 50
  registration_frame_num: 5
  local_frame_num: 15
  rebuild_every_n_frames: 5

register:
  max_correspondence_distance: 0.15
  max_iter: 1000
  transformation_epsilon: 1e-6
  euclidean_fitness_epsilon: 1e-5
  max_fitness_score: 0.5
  max_translation_delta: 0.5
  max_rotation_delta_deg: 15.0
  submap_x_radius: 3.0
  submap_y_radius: 3.0
  submap_z_radius: 1.5
  min_submap_points: 100

roi:
  uav_radius: 0.3
  x_min: -3.25
  x_max: 0.55
  y_min: -3.15
  y_max: 0.65
  z_min: 0.3
  z_max: 1.5

# ── FAST-LIO 管线专用 ROI（cloud_source: fastlio 时使用，独立于上方 roi:）──
# 复制自 roi: 段，参数可按需单独调整，不影响 livox 管线的 roi:
roi_fastlio:
  uav_radius: 0.3
  x_min: -3.25
  x_max: 0.55
  y_min: -3.15
  y_max: 0.65
  z_min: -1.0
  z_max: 3.0

# ── 配准前ROI：在ICP配准之前先用ROI裁剪世界坐标点云，减少无关背景点干扰 ──
# 未指定时默认沿用上方 roi: 的对应值
pre_register_roi:
  enabled: true         # 配准计算变换矩阵之前是否先roi
  min_points: 20         # ROI后最少点数，低于此回退全量点云
  # x_min: -3.25         # 不设则用 roi/x_min
  # x_max: 0.55
  # y_min: -3.15
  # y_max: 0.65
  # z_min: 0.3
  # z_max: 1.5

dilation:
  radius: 0
  steps: 12

erosion:
  mean_k: 7
  thresh: 0.8

projection:
  plane_z: 0.7

# ==================== 方环检测 (穿环) ====================
ring_pipeline:
  enabled: true
  input_cloud_topic: "/pcl_detection2/downsampled_accumulated_cloud"
  use_topic_input: false       # main.cpp 已同进程直传，避免 livox 模式重复订阅、重复检测
  publish_debug_cloud: false   # 飞行时关闭平面调试点云，减少 CPU 与 Foxglove 带宽
  max_planes: 2
  dump_enabled: false          # 调试用：启动15s后每5s保存投影图到temp/

ring_plane:
  # ROI (平面提取前的裁剪范围，世界坐标系)
  roi_x_min: -2.0
  roi_x_max: -0.5
  roi_y_min: -1.00
  roi_y_max: 1.25
  roi_z_min: -0.15
  roi_z_max: 3.25

  # 欧式聚类
  cluster_tolerance: 0.15
  cluster_min_size: 100
  cluster_max_size: 30000

  # RANSAC 平面拟合
  ransac_distance_threshold: 0.03
  ransac_min_inliers: 50
  max_planes_per_cluster: 4      # 每个欧式聚类中最多提取的平面数 (迭代RANSAC)

  # 平面筛选
  min_plane_area_points: 300
  max_plane_vertical_angle: 30.0

  # 投影参数
  projection_resolution: 0.05
  projection_margin: 20

ring_match:
  # ============ 固定尺寸方环检测（找缺口 + 固定尺寸验证，替代多尺度模板匹配）============
  # 方案：投影二值图反相 → findContours 找黑区缺口（环孔洞）→ minAreaRect 验证
  #       边长落在固定方环尺寸范围内 → 输出 4 角点。不做 169×N 次 matchTemplate。
  # 目的：方环检测仅用于可视化（实际任务走定点/穿环，检测结果不参与控制），性能优先。

  # 固定方环尺寸范围（像素）：环孔 1.1m @ 投影分辨率 0.05m/px ≈ 22px
  # 范围放宽到 ±2 倍，覆盖透视变形与点云稀疏/形态学闭合造成的偏差
  fixed_ring_min_px: 10
  fixed_ring_max_px: 45

  # 方形度：minAreaRect 长边/短边 最大比值（透视下方形会变形，放宽到 2.0）
  max_aspect_ratio: 2.0

  # 孔洞填充度：轮廓面积 / 外接矩形面积 下限（真孔洞应接近实心）
  min_fill_ratio: 0.5

  # 最小孔洞面积（像素²），过滤小噪点
  min_hole_area: 80

  # 形态学核大小 (填充稀疏LiDAR投影的缝隙)
  # 点云噪点/偏移导致环边界有空洞，需用较大核做 CLOSE 填满
  # 0.05m/pixel × 9 = 0.45m，能填大多数空隙又不至于堵死孔洞
  morphology_kernel_size: 9

  # 每张投影图最大检测环数
  max_rings_per_image: 3

  # ---- 以下为旧多尺度模板匹配参数，已弃用（仅保留便于回退，不再参与计算）----
  # template_paths:
  #   - "obs1.png"
  #   - "obs_from_dump.png"
  # template_path: ""
  # template_thresholds: []
  # match_threshold: 0.35
  # match_method: 5
  # scale_x_min: 0.7
  # scale_x_max: 1.3
  # scale_x_step: 0.05
  # scale_y_min: 0.7
  # scale_y_max: 1.3
  # scale_y_step: 0.05
  # nms_iou_threshold: 0.3
  # min_hole_ratio: 0.2
  # expected_size_min: 100
  # expected_size_max: 400
  # contour_area_ratio_min: 0.5

# 环3D位置过滤（世界坐标系，发布前过滤掉位置不合理的环）
ring_filter:
  enabled: true
  x_min: -2.0
  x_max: -0.3
  y_min: -0.4
  y_max: 0.4
  z_min: 0.5
  z_max: 2.0

# ── 环位置先验：环在场地位置固定（场系 x=2 处墙上的 1.1m 方孔）──
# odom 系 = 场系绕出生点(0.65,0.75)转180°：p_odom = (0.65 - x_field, 0.75 - y_field)
# 环孔中心场系 (2.0, 0.75) → odom (-1.35, 0.0)；穿环高度 z=1.3
# 用途：反投影出的环中心超出范围直接丢弃（过滤误检缺口/墙缝）
# 注意：坐标系与 pcl_detection2 世界系一致（= 启动时刻的 odom 系，与 traverse_map 同约定），
#       出生点或环位变了要同步改
ring_prior:
  enabled: true
  center_x: -1.35      # 环中心 X (odom 系, m)
  center_y: 0.0        # 环中心 Y (odom 系, m)
  center_z: 1.3        # 环中心 Z (odom 系, m)
  search_radius: 0.2   # XY 半径 (m)；0 或负 = 不启用 XY 距离过滤
  z_tolerance: 0.3     # Z 容差 (m)；0 或负 = 不启用 Z 过滤

# === 柱子检测（坐标判定为主，模板匹配兜底，2026-08 重构）===
# 【case 命名规则（全队统一，与 raicom_vision_laser/config/traverse_map.yaml、
#   main_control 的 TRAV_CASE_PILLARS 一致，勿单独改）】
#   候选索引: 0=A左(2.7,1.55) 1=A右(3.3,1.55) 2=B左(2.7,2.8) 3=B右(3.3,2.8)（括号为场系坐标）
#   case0 = A左+B左（两柱都在 x=2.7）
#   case1 = A左+B右
#   case2 = A右+B左
#   case3 = A右+B右（两柱都在 x=3.3）
# 检测输出 /pcl_detection2/pillar_case_id 即此编号，直接当穿越 case 用。
pillar_detect_enabled: true

# ---- 坐标判定（主）：数 4 个候选柱位半径内 ROI 点数，A/B 侧各出 1 根拼 case ----
pillar_coord:
  radius: 0.3          # 柱位判定半径 (m)
  min_points: 5         # 半径内点数 >= 此值判"有柱"（仿真点云干净先取灵敏值，真机再调）
  confirm_frames: 3     # 连续 N 帧组合一致才发布（防单帧噪声误判）
  ambiguous_ratio: 0.8  # 同侧两候选都过阈值且点数比 >= 此值 -> 歧义，回退模板匹配

pillar_debug:
  dump_enabled: false    # 调参时再开；关闭 PNG/PCD 磁盘写入，避免飞行时 I/O 抖动

# ---- 模板匹配（兜底）：仅坐标判定歧义时使用 ----
# 注意：改动下方 pillar_roi/resolution 后必须重跑 tools/make_pillar_templates.py！
pillar_roi:
  x_min: -3.5
  x_max: -1.2
  y_min: -3.15
  y_max: 0.5
  z_min: -1.0
  z_max: 2.5
  resolution: 0.05
  match_threshold: 0.5    # 兜底判定阈值（合成分 = 模板分×(1+权重×密度分)）
  proj_upscale: 1         # 投影图放大倍数 (大于tpl以给matchTemplate留滑动空间)
  tpl_upscale: 1          # 模板放大倍数
  density_weight: 0.3     # 兜底合成分中密度分权重 (0~1)

# 4 个候选柱位（odom 系，= 场系绕出生点(0.65,0.75)转180°；坐标判定与模板共用）
pillar_pos:
  p1_pos1: [-2.05, -0.80]   # A左 = 场系 (2.7,1.55)
  p1_pos2: [-2.65, -0.80]   # A右 = 场系 (3.3,1.55)
  p2_pos1: [-2.05, -2.05]   # B左 = 场系 (2.7,2.8)
  p2_pos2: [-2.65, -2.05]   # B右 = 场系 (3.3,2.8)
